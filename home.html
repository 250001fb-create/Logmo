<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - Logmo</title>
    <link rel="stylesheet" href="css/home.css">
    <script src="js/modal.js" defer></script>
</head>
<body>

    <header class="app-header">
        <img src="img/logo.png" alt="ロゴ" class="logo-img-small">
        <h2>Logmo</h2>
        
        <div class="header-actions">
            <a href="calender.html" class="btn-go-calendar">📅 カレンダー</a>
            <a href="list.html" class="btn-go-list">📝 全データ一覧</a>
            <button id="logoutBtn" class="logout-btn">🚪 ログアウト</button>
        </div>
    </header>

    <div class="weekly-calendar">
        <div class="calendar-header-inside">
            <div id="calendarTitle" class="calendar-title">2026年 6月</div>        </div>
        <div id="weeklyDays" class="weekly-days">
            <div class="day">月</div>
            <div class="day">火</div>
            <div class="day">水</div>
            <div class="day active-day">木</div>
            <div class="day">金</div>
            <div class="day">土</div>
            <div class="day">日</div>
        </div>
    </div>

    <div class="task-section">
        <div class="section-header">
            <h3 id="taskSectionTitle">本日の予定・タスク</h3>
            <button id="openAddModalBtn" class="add-btn">＋追加</button>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-type="all">すべて</button>
            <button class="filter-btn" data-type="habit">習慣</button>
            <button class="filter-btn" data-type="task">タスク</button>
            <button class="filter-btn" data-type="schedule">予定</button>
        </div>

        <div id="taskContainer">
            <p style="text-align: center; color: #999;">データを読み込み中...</p>
        </div>
    </div>

    <div class="ai-advice">
        <h4>🤖 AIアドバイザーからの提案</h4>
        <p id="aiAdviceArea">今日のデータを読み込み、分析しています...</p>
    </div>

    <script src="js/item-actions.js" defer></script>
    <script src="js/home.js" defer></script>
</body>
</html>
