<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完了・メモ - Logmo</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background:#e0f2f1; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        .box { background:#fff; padding:24px; border-radius:12px; width:90%; max-width:360px; box-shadow:0 4px 15px rgba(0,0,0,.1); box-sizing:border-box; }
        h2 { color:#00838f; margin-top:0; font-size:16px; }
        textarea { width:100%; box-sizing:border-box; padding:10px; border:1px solid #b2dfdb; border-radius:6px; font-size:14px; min-height:80px; font-family:inherit; }
        button { margin-top:14px; width:100%; padding:12px; background:#00838f; color:#fff; border:none; border-radius:6px; font-weight:bold; font-size:14px; cursor:pointer; }
        button:disabled { background:#b0bec5; }
        #status { margin-top:10px; font-size:13px; text-align:center; color:#00838f; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📝 メモを書いて完了にする</h2>
        <textarea id="memoInput" placeholder="メモを入力（空欄でもOK）"></textarea>
        <button id="submitBtn">✅ 完了にする</button>
        <p id="status"></p>
    </div>
    <script src="js/quick_complete.js"></script>
</body>
</html>
